<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick WhatsApp Store</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #10b981;
      --accent-hover: #059669;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; min-height: 100vh; }
    header { text-align: center; margin-bottom: 24px; padding: 16px 0; border-bottom: 1px solid #334155; }
    h1 { font-size: 1.5rem; color: #fff; margin-bottom: 4px; }
    p.subtitle { color: var(--muted); font-size: 0.9rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
    .card { background: var(--card); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; border: 1px solid #334155; }
    .card img { width: 100%; height: 160px; object-fit: cover; background: #334155; }
    .card-body { padding: 12px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
    .title { font-size: 0.95rem; font-weight: 600; margin-bottom: 6px; }
    .price { font-size: 1.1rem; color: var(--accent); font-weight: 700; margin-bottom: 12px; }
    .btn { background: var(--accent); color: #fff; text-decoration: none; border: none; padding: 10px; border-radius: 8px; font-weight: 600; text-align: center; cursor: pointer; display: block; width: 100%; font-size: 0.9rem; }
    .btn:active { background: var(--accent-hover); }
  </style>
</head>
<body>

  <header>
    <h1 id="shop-name">Loading...</h1>
    <p class="subtitle">Tap any item to instant order via WhatsApp</p>
  </header>

  <div class="grid" id="product-grid"></div>

  <script>
    // ==========================================
    // EVERYTHING YOU EDIT IS INSIDE THIS CONFIG
    // ==========================================
    const shopConfig = {
      shopName: "Urban Thrift Nepal",
      // Include country code without '+' (977 for Nepal)
      whatsappNumber: "9779800000000", 
      currency: "Rs",
      products: [
        {
          id: 1,
          name: "Vintage Denim Jacket",
          price: 1800,
          img: "https://images.unsplash.com/photo-1576995853123-5a10305d93c0?w=400"
        },
        {
          id: 2,
          name: "Oversized Graphic Tee",
          price: 950,
          img: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=400"
        },
        {
          id: 3,
          name: "Cargo Pants Black",
          price: 2200,
          img: "https://images.unsplash.com/photo-1624378439575-d8705ad7ae80?w=400"
        }
      ]
    };

    // Render Store Info
    document.getElementById("shop-name").innerText = shopConfig.shopName;

    // Render Product Cards
    const grid = document.getElementById("product-grid");
    grid.innerHTML = shopConfig.products.map(p => `
      <div class="card">
        <img src="${p.img}" alt="${p.name}">
        <div class="card-body">
          <div>
            <div class="title">${p.name}</div>
            <div class="price">${shopConfig.currency} ${p.price}</div>
          </div>
          <button class="btn" onclick="orderItem('${p.name}', ${p.price})">Order Now</button>
        </div>
      </div>
    `).join("");

    // WhatsApp Order Link Logic
    function orderItem(name, price) {
      const text = `Hello! I would like to order: *${name}* (${shopConfig.currency} ${price}). Is it available?`;
      const encoded = encodeURIComponent(text);
      const url = `https://wa.me/${shopConfig.whatsappNumber}?text=${encoded}`;
      window.open(url, '_blank');
    }
  </script>
</body>
</html>
